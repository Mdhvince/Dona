# Assistant configuration - API keys stay in .env

[llm]
# Chat model of the agent, through Ollama's native API. Reasoning stays on:
# for agents, tool-call discipline lives in the thinking.
model = "qwen3:30b"
base_url = "http://localhost:11434"
temperature = 0.15
num_predict = 4000  # structured output with long answers gets truncated below this
reasoning = true  # surfaces thinking tokens so the UI can show live progress

[embedding]
model = "qwen3-embedding:8b"
base_url = "http://localhost:11434/v1"  # Ollama's OpenAI-compatible API - fully local

[vlm]
# Vision model: transcribes PDF pages and images at ingestion time.
# reasoning = false: transcription does not need reasoning (~12x faster).
model = "qwen3.5:9b"
base_url = "http://localhost:11434"
temperature = 0.0
reasoning = false

[retriever]
k1 = 1.5      # BM25: term frequency saturation [1.2 - 2.0]
b = 0.75      # BM25: document length normalization [0.0 - 1.0]
k = 6         # number of documents returned after fusion
fetch_k = 12  # depth of each ranking before RRF fusion
rrf_k = 60    # Reciprocal Rank Fusion smoothing constant

[ingestion]
# Size applied to Markdown sections that are still too long after the
# header-based structural split - 1000 to avoid cutting tables in half.
chunk_size = 1000
chunk_overlap = 100

# MCP servers exposed to the agent as tools, one block per server. The same
# server runs once per account (GOOGLE_ACCOUNT_MODE selects the OAuth token,
# created via: npx @cocal/google-calendar-mcp auth <account>): tools get
# renamed <name>_<tool>. "tools" is a read-only whitelist: anything not
# listed is not given to the agent.

[[mcp]]
name = "calendar_pro"
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp"]
tools = ["list-calendars", "list-events", "search-events", "get-freebusy", "get-current-time"]
fixed_args = { account = "pro" }
description_suffix = "(Compte professionnel Myelink, mvinceslas@myelink.io.)"
[mcp.env]
GOOGLE_OAUTH_CREDENTIALS = "/Users/medhyvinceslas/.secrets/google-oauth.json"
GOOGLE_ACCOUNT_MODE = "pro"

[[mcp]]
name = "calendar_perso"
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp"]
tools = ["list-calendars", "list-events", "search-events", "get-freebusy", "get-current-time"]
fixed_args = { account = "perso" }
description_suffix = "(Compte personnel, medhy.vinceslas@gmail.com.)"
[mcp.env]
GOOGLE_OAUTH_CREDENTIALS = "/Users/medhyvinceslas/.secrets/google-oauth.json"
GOOGLE_ACCOUNT_MODE = "perso"
