# Assistant configuration - API keys and personal data (emails, paths) stay
# in .env as ${VAR} placeholders - see .env.example

[llm]
# Chat model of the agent, through Ollama's native API. Reasoning stays on:
# for agents, tool-call discipline lives in the thinking.
model = "qwen3.6:35b-mlx"
base_url = "http://localhost:11434"
temperature = 0.15
num_predict = 4000  # structured output with long answers gets truncated below this
reasoning = true  # surfaces thinking tokens so the UI can show live progress

[router]
# Same weights as [llm] (think is a per-request flag, so no extra memory):
# routing and small talk skip the thinking, the tool agent keeps it.
model = "qwen3.6:35b-mlx"
base_url = "http://localhost:11434"
temperature = 0.0
num_predict = 200
reasoning = false

[embedding]
model = "bge-m3" #"qwen3-embedding:8b"
base_url = "http://localhost:11434/v1"  # Ollama's OpenAI-compatible API - fully local

[vlm]
# Vision model: transcribes PDF pages and images at ingestion time.
# reasoning = false: transcription does not need reasoning (~12x faster).
model = "glm-ocr"  #"qwen3.5:9b"
base_url = "http://localhost:11434"
temperature = 0.0
reasoning = false

[retriever]
k1 = 1.5      # BM25: term frequency saturation [1.2 - 2.0]
b = 0.75      # BM25: document length normalization [0.0 - 1.0]
k = 6         # number of documents returned after fusion
fetch_k = 12  # depth of each ranking before RRF fusion
rrf_k = 60    # Reciprocal Rank Fusion smoothing constant

[ingestion]
# Size applied to Markdown sections that are still too long after the
# header-based structural split - 1000 to avoid cutting tables in half.
chunk_size = 1000
chunk_overlap = 100

# MCP servers exposed to the agent as tools, one block per server (stdio);
# tools get renamed <name>_<tool>, "tools" is a read-only whitelist,
# fixed_args pins values the model must not control, json_result declares
# that valid results are JSON (anything else = tool error).

[[mcp]]
name = "calendar_pro"
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp"]
tools = ["list-calendars", "list-events", "search-events", "get-freebusy", "get-current-time", "create-event"]
# Side-effecting tools: never run without an explicit confirmation
confirm = ["create-event"]
json_result = true
fixed_args = { account = "pro" }
default_args = { calendarId = "primary", timeMin = "@now-30d", timeMax = "@now+365d" }
description_suffix = "(Compte professionnel Myelink, ${MYELINK_EMAIL}.)"
[mcp.env]
GOOGLE_OAUTH_CREDENTIALS = "${GOOGLE_OAUTH_CREDENTIALS}"
GOOGLE_ACCOUNT_MODE = "pro"

[[mcp]]
name = "calendar_perso"
command = "npx"
args = ["-y", "@cocal/google-calendar-mcp"]
tools = ["list-calendars", "list-events", "search-events", "get-freebusy", "get-current-time", "create-event"]
# Side-effecting tools: never run without an explicit confirmation
confirm = ["create-event"]
json_result = true
fixed_args = { account = "perso" }
default_args = { calendarId = "primary", timeMin = "@now-30d", timeMax = "@now+365d" }
description_suffix = "(Compte personnel, ${PERSONAL_EMAIL}.)"
[mcp.env]
GOOGLE_OAUTH_CREDENTIALS = "${GOOGLE_OAUTH_CREDENTIALS}"
GOOGLE_ACCOUNT_MODE = "perso"

[[mcp]]
name = "qonto"
transport = "http"
url = "https://mcp.qonto.com/mcp"
# The server exposes 62 tools, many of them side-effecting (cards,
# transfers, invoices): only read-only ones are given to the agent
tools = ["get_organization", "list_transactions", "get_transaction",
         "list_statements", "list_client_invoices", "list_supplier_invoices",
         "list_cards"]
json_result = true
description_suffix = "(Compte bancaire professionnel Myelink, lecture seule.)"
