<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant Myelink</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>Assistant</h1>
      <div class="reindex">
        <span id="reindex-status"></span>
        <button id="reindex-button" type="button">Re-indexer</button>
      </div>
    </header>

    <details id="reindex-warnings" hidden>
      <summary></summary>
      <ul></ul>
    </details>

    <form id="ask-form" autocomplete="off">
      <input id="question" type="text" placeholder="Pose ta question..." required autofocus>
      <button id="ask-button" type="submit">Demander</button>
    </form>

    <div id="spinner" class="spinner" hidden></div>
    <section id="answer" hidden></section>
    <p id="answer-sources" hidden></p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
